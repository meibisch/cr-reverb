<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chasing Reverbs — Play</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0d0d0d;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 48px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #controls.visible {
      opacity: 1;
      pointer-events: all;
    }

    #playPauseBtn {
      pointer-events: all;
      width: 52px;
      height: 52px;
      border: 1px solid rgba(235, 235, 235, 0.3);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s, opacity 0.3s;
      outline: none;
    }

    #playPauseBtn:hover {
      border-color: rgba(235, 235, 235, 0.7);
    }

    #playPauseBtn svg {
      fill: rgba(235, 235, 235, 0.7);
      transition: fill 0.3s;
    }

    #playPauseBtn:hover svg {
      fill: #ebebeb;
    }

    #playPauseBtn .icon-pause { display: none; }
    #playPauseBtn.playing .icon-play  { display: none; }
    #playPauseBtn.playing .icon-pause { display: block; }

    #track-selector {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
    }

    .track-btn {
      background: none;
      border: none;
      color: rgba(235, 235, 235, 0.22);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
      pointer-events: all;
      transition: color 0.3s;
      font-family: inherit;
    }

    .track-btn:hover,
    .track-btn.active {
      color: rgba(235, 235, 235, 0.65);
    }

    #hint {
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: rgba(235, 235, 235, 0.18);
      text-transform: uppercase;
    }

    #error-msg {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(235, 235, 235, 0.4);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="controls">
    <div id="track-selector">
      <button class="track-btn" data-index="0">Out of the Blue</button>
      <button class="track-btn" data-index="1">I See Fire</button>
      <button class="track-btn" data-index="2">Spotting Clouds</button>
    </div>
    <button id="playPauseBtn" aria-label="Play / Pause">
      <svg class="icon-play" width="18" height="18" viewBox="0 0 18 18">
        <polygon points="5,2 16,9 5,16"/>
      </svg>
      <svg class="icon-pause" width="18" height="18" viewBox="0 0 18 18">
        <rect x="3" y="2" width="4" height="14"/>
        <rect x="11" y="2" width="4" height="14"/>
      </svg>
    </button>
    <div id="hint">Space to play · Chasing Reverbs</div>
  </div>

  <div id="error-msg"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
